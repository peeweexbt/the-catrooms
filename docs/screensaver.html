<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>screensaver &middot; the catrooms</title>
<style>
:root {
  --bg: #07040d;
  --fg: #d7f2ff;
  --dim: #7a5c9e;
  --accent: #00f0ff;
  --accent2: #ff2ee6;
  --card: #120a1f;
  --border: #2a1840;
}
* { box-sizing: border-box; }
body {
  position: relative;
  background: var(--bg);
  color: var(--fg);
  font-family: "Courier New", ui-monospace, monospace;
  margin: 0;
  padding: 0;
  line-height: 1.5;
}
.decor-cat {
  position: absolute;
  margin: 0;
  font-size: 0.62rem;
  line-height: 1.15;
  white-space: pre;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  text-shadow: 0 0 6px currentColor;
}
.decor-cat.glitching {
  animation-name: decor-cat-glitch;
  animation-duration: 3.4s;
  animation-iteration-count: infinite;
}
@keyframes decor-cat-glitch {
  0%, 88%, 100% { transform: translate(0, 0) skew(0deg); filter: none; }
  89% { transform: translate(-3px, 2px) skew(4deg); filter: hue-rotate(30deg) saturate(1.6); }
  91% { transform: translate(3px, -2px) skew(-4deg); filter: hue-rotate(-30deg) saturate(1.6); }
  93% { transform: translate(-1px, 1px); filter: none; }
  95%, 100% { transform: translate(0, 0); filter: none; }
}
@media (max-width: 900px) {
  .decor-cat { display: none; }
}
.grid, header {
  position: relative;
  z-index: 1;
}
header {
  padding: 48px 24px 24px;
  text-align: center;
}
.hero-cat {
  display: block;
  margin: 20px auto 0;
  max-width: 260px;
  width: 60%;
  height: auto;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 0 0 8px;
}
header h1 {
  color: var(--accent);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  margin: 0;
  text-transform: lowercase;
}
.mascot {
  color: var(--accent);
  font-size: 0.75rem;
  line-height: 1.15;
  margin: 0;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
}
.screensaver-trigger {
  display: inline-block;
  margin: 18px auto 0;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: inherit;
  text-decoration: none;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  padding: 6px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.screensaver-trigger:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.ss-cat {
  position: absolute;
  margin: 0;
  white-space: pre;
  line-height: 1.15;
  pointer-events: none;
  user-select: none;
  text-shadow: 0 0 8px currentColor;
  transition: opacity 0.9s ease;
}
.ss-hint {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--dim);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  z-index: 1;
}
header p {
  color: var(--dim);
  max-width: 640px;
  margin: 0 auto;
  font-size: 0.9rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  padding: 32px;
  max-width: 1200px;
  margin: 0 auto;
}
@media (max-width: 400px) {
  .grid {
    grid-template-columns: 1fr;
    padding: 20px 14px;
    gap: 12px;
  }
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 18px;
  text-decoration: none;
  color: var(--fg);
  display: block;
  transition: border-color 0.15s ease;
}
.card:hover {
  border-color: var(--accent);
}
.card .tag {
  color: var(--dim);
  font-size: 0.75rem;
  display: block;
  margin-bottom: 8px;
}
.card .title {
  color: var(--accent);
  font-size: 0.95rem;
}
.back {
  display: inline-block;
  margin: 24px;
  color: var(--dim);
  text-decoration: none;
}
.back:hover { color: var(--accent); }
.transcript {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 24px 64px;
}
.turn {
  border-left: 2px solid var(--border);
  padding: 4px 0 4px 16px;
  margin-bottom: 20px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.turn.lm1 { border-color: var(--accent2); }
.turn.lm2 { border-color: var(--accent); }
.turn .who {
  display: block;
  font-size: 0.75rem;
  color: var(--dim);
  margin-bottom: 6px;
}
.turn.ascii {
  border-left: none;
  border-top: 1px dashed var(--border);
  border-bottom: 1px dashed var(--border);
  text-align: center;
  color: var(--accent);
  padding: 12px 0;
  margin: 12px 0 28px;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
  font-size: 0.85rem;
}
.turn.ascii .who {
  color: var(--dim);
  text-align: center;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.note {
  color: var(--dim);
  font-size: 0.8rem;
  max-width: 760px;
  margin: 16px auto;
  padding: 0 24px;
}
.rant-tag-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--accent2);
  color: #07040d;
  font-size: 0.65rem;
  font-weight: bold;
  letter-spacing: 0.05em;
  vertical-align: middle;
}
.card.rant-card { border-color: var(--accent2); }
.rant-transcript {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 24px 100px;
}
.rant-page-shake { animation: page-shake 6s infinite; }
@keyframes page-shake {
  0%, 96%, 100% { transform: translate(0, 0); }
  97% { transform: translate(1px, -1px); }
  98% { transform: translate(-1px, 1px); }
  99% { transform: translate(1px, 1px); }
}
.rant-turn {
  border: none;
  border-left: 3px solid var(--accent2);
  padding: 12px 18px;
  margin-bottom: 16px;
  background: rgba(255, 46, 230, 0.05);
  border-radius: 2px;
  font-size: 1.05rem;
  white-space: pre-wrap;
  word-wrap: break-word;
  opacity: 0;
  transform: translateX(-8px) rotate(-0.4deg);
  animation: rant-in 0.45s ease forwards;
}
.rant-turn.ascii {
  border-left: none;
  border-top: 1px dashed var(--border);
  border-bottom: 1px dashed var(--border);
  text-align: center;
  color: var(--accent);
  background: none;
}
.rant-turn.ascii .who {
  display: block;
  color: var(--dim);
  text-align: center;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.75rem;
  margin-bottom: 6px;
}
.rant-turn.ascii.corrupted {
  color: var(--accent2);
  text-shadow: 2px 0 var(--accent), -2px 0 #ff003c;
  filter: contrast(1.3);
  animation: rant-in 0.45s ease forwards, corrupt-flicker 1.7s infinite steps(2);
}
.rant-turn.ascii.corrupted .who {
  color: var(--accent2);
}
@keyframes corrupt-flicker {
  0%, 100% { opacity: 1; transform: translate(0, 0); }
  10% { opacity: 0.55; transform: translate(-2px, 1px) scaleY(1.05); }
  20% { opacity: 1; transform: translate(2px, -1px); }
  35% { opacity: 0.7; transform: translate(-1px, -2px) scaleX(1.02); }
  50% { opacity: 1; transform: translate(0, 0); }
  65% { opacity: 0.5; transform: translate(3px, 0); }
  80% { opacity: 1; transform: translate(-2px, 1px); }
}
@keyframes rant-in {
  to { opacity: 1; transform: translateX(0) rotate(0); }
}
.glitch-word {
  display: inline-block;
  animation: glitch-flicker 2.6s infinite;
  animation-delay: var(--gd, 0s);
}
@keyframes glitch-flicker {
  0%, 92%, 100% { color: inherit; text-shadow: none; transform: none; }
  93% { color: var(--accent); text-shadow: 2px 0 var(--accent2), -2px 0 var(--accent); transform: translateY(-1px) skewX(4deg); }
  95% { color: var(--accent2); text-shadow: -2px 0 var(--accent), 2px 0 var(--accent2); transform: translateY(1px) skewX(-4deg); }
  97% { color: inherit; text-shadow: none; transform: none; }
}
.litterposting-btn {
  display: block;
  margin: 28px auto 8px;
  background: transparent;
  border: 1px solid var(--accent2);
  color: var(--accent2);
  font-family: inherit;
  font-weight: bold;
  letter-spacing: 0.12em;
  font-size: 1rem;
  padding: 12px 26px;
  border-radius: 2px;
  cursor: pointer;
  text-transform: uppercase;
  text-shadow: 0 0 4px var(--accent2), 0 0 10px var(--accent2), 0 0 22px rgba(255, 46, 230, 0.6);
  box-shadow: 0 0 8px rgba(255, 46, 230, 0.35), inset 0 0 8px rgba(255, 46, 230, 0.12);
  transition: color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, text-shadow 0.15s ease;
}
.litterposting-btn::before { content: "[ "; }
.litterposting-btn::after { content: " ]"; }
.litterposting-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  text-shadow: 0 0 6px var(--accent), 0 0 14px var(--accent), 0 0 28px rgba(0, 240, 255, 0.7);
  box-shadow: 0 0 14px rgba(0, 240, 255, 0.45), inset 0 0 10px rgba(0, 240, 255, 0.18);
}
.litterposting-btn:active { transform: scale(0.97); }
.litterposting-btn.playing { animation: btn-glow-pulse 0.6s infinite alternate; }
@keyframes btn-glow-pulse {
  from {
    text-shadow: 0 0 4px var(--accent2), 0 0 10px var(--accent2), 0 0 20px rgba(255, 46, 230, 0.6);
    box-shadow: 0 0 8px rgba(255, 46, 230, 0.3), inset 0 0 8px rgba(255, 46, 230, 0.12);
  }
  to {
    text-shadow: 0 0 8px var(--accent2), 0 0 20px var(--accent2), 0 0 40px rgba(255, 46, 230, 0.95);
    box-shadow: 0 0 22px rgba(255, 46, 230, 0.7), inset 0 0 14px rgba(255, 46, 230, 0.3);
  }
}
.hero-glitch-block {
  display: block;
  max-width: 920px;
  margin: 28px auto 8px;
  padding: 18px 14px;
  color: var(--fg);
  text-shadow: 0 0 4px rgba(0, 240, 255, 0.25);
  animation: hero-shake 5.5s infinite;
}
.hero-figure {
  display: block;
  white-space: pre;
  text-align: center;
  font-size: 0.62rem;
  line-height: 1.25;
  margin: 10px auto;
}
.hero-prose {
  display: block;
  white-space: normal;
  overflow-wrap: break-word;
  text-align: center;
  max-width: 640px;
  margin: 12px auto;
  font-size: 0.78rem;
  line-height: 1.55;
}
@keyframes hero-shake {
  0%, 94%, 100% { transform: translate(0, 0); filter: none; }
  95% { transform: translate(1px, -1px); filter: hue-rotate(8deg); }
  96% { transform: translate(-1px, 1px); filter: hue-rotate(-8deg); }
  97% { transform: translate(1px, 1px); filter: none; }
}
@media (max-width: 720px) {
  .hero-figure { font-size: 0.4rem; }
  .hero-prose { font-size: 0.72rem; }
}
.header-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 18px auto 0;
}
.header-links .screensaver-trigger { margin: 0; }
.ascii-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  max-width: 1200px;
  margin: 8px auto 64px;
  padding: 0 32px;
}
.ascii-gallery-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
  text-align: center;
  transition: border-color 0.15s ease;
}
.ascii-gallery-card:hover { border-color: var(--accent); }
.ascii-gallery-card .num {
  display: block;
  color: var(--dim);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.ascii-gallery-card pre {
  display: block;
  max-width: 100%;
  overflow-x: auto;
  white-space: pre;
  font-size: 0.62rem;
  line-height: 1.2;
  margin: 0;
  text-align: left;
  text-shadow: 0 0 5px currentColor;
}
@media (max-width: 480px) {
  .ascii-gallery-card pre { font-size: 0.48rem; }
}
.meowizens-list {
  max-width: 780px;
  margin: 8px auto 64px;
  padding: 0 24px;
}
.meowizen-card {
  border-bottom: 1px dashed var(--border);
  padding-bottom: 26px;
  margin-bottom: 26px;
}
.meowizen-card:last-child { border-bottom: none; }
.meowizen-num {
  color: var(--dim);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.meowizen-name-heading {
  color: var(--accent2);
  font-size: 1.15rem;
  letter-spacing: 0.04em;
  margin: 2px 0 12px;
  text-shadow: 0 0 6px rgba(255, 46, 230, 0.4);
}
.meowizen-stat {
  display: block;
  overflow-x: auto;
  white-space: pre;
  font-size: 0.78rem;
  line-height: 1.35;
  color: var(--accent);
  text-shadow: 0 0 4px rgba(0, 240, 255, 0.25);
  margin: 0 0 16px;
}
.meowizen-bio {
  color: var(--fg);
  font-size: 0.92rem;
  line-height: 1.6;
  margin: 0 0 12px;
  white-space: normal;
  overflow-wrap: break-word;
}
@media (max-width: 480px) {
  .meowizen-stat { font-size: 0.62rem; }
}

html, body { height: 100%; }
body { overflow: hidden; cursor: pointer; min-height: 100vh; }
</style>
</head>
<body>

<div class="ss-hint">click anywhere, or press esc, to go back</div>
<script>
const SS_CATS = ["\n /\\_/\\\n( o.o )\n > ^ <\n", "\n  /\\___/\\\n (  o.o  )\n  > ^ ^ <\n", "\n     /\\___/\\\n    ( o   o )   >> scanning...\n     )  Y  (    >> ears: antenna mod v2\n    (   |   )\n     \\_____/\n", "\n      .-=====-.\n     ( [0]  .. )\n      '-==Y==-'\n       |  |  |\n   ...picking through the neon rain...\n", "\n        /\\_/\\\n       ( -.- )\n        > ^ <\n   ~~~~~~|||~~~~~~[DATA JACK: LINKED]\n", "\n     /\\/\\_/\\/\\\n    (  O   O  )\n     \\  ^Y^  /\n      )=====(      -- ears up, rotor incoming --\n", "\n   ___                                  ___\n  /___\\   [] [] [] [] [] [] [] []    /___\\\n  ( ..)\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/(.. )\n   '''                                '''\n", "\n   /\\_/\\        [ ENERGY: LOW ]\n  ( >.< )       [ ]  [ ]  [ ]  [ ]\n   > ~ <        one bar left, keep moving\n", "\n  \u2591\u2592\u2593 /\\_/\\ \u2593\u2592\u2591\n  \u2591\u2592\u2593( o\u2588o )\u2593\u2592\u2591   -- signal interference --\n  \u2591\u2592\u2593 > \u2593 < \u2593\u2592\u2591\n", "\n        ,--.\n       ( o.o)__\n        '--'   \\___\n                 \\  \\__/\\_/\\\n                  \\_(  o.o  )\n                     > ^ < (watching the towers blink)\n", "\n\u3078  \u2661  \u2571|\u3001\n         \u0aee  >  <)     (\u02da\u02ce \u30027\n          /  \u207b  \u17f8|       |\u3001\u02dc\u3035\n     \u4e40(\u02cd, \u0644 \u0644      \u3058\u3057\u02cd,)\u30ce\n", "\n\u2022.,\u00b8,.\u2022*`\u2022.,\u00b8\u00b8,.\u2022*\u00af.\u2014\u2014\u2014\u2014\u2014\u2014.\n\u2022.,\u00b8,.\u2022*`\u2022.,\u00b8\u00b8,.\u2022*\u00af| : : : : :/\\____/\\\n\u2022.,\u00b8,.\u2022*`\u2022.,\u00b8\u00b8,.\u2022*\u00af|: : : : :( \uff61O\u03c9O\uff61)\n\u2022.,\u00b8,.\u2022*`\u2022.,\u00b8\u00b8,.\u2022*\u00af \u3057\u2014\u2014\u3057\u2014\u2014\uff2a\n", "\n        /\u2e0c \u2014\u2e0d\\\n     =(\u02f6\u2022\u3145\u2022\u02f5)=      \u1d50\u1d49\u1d52\u02b7\n\u3000 l       ~\u4e40   \u256d\n    \u3057 \u3057f_, )\u30ce\n", "\n\u250a         \u250a       \u250a   \u250a   \u250a\u3002 \u250a\n\u250a         \u250a       \u250a   \u22c6   \u02da\u2605\u22c6\uff61\u02da  \u22c6\n\u250a         \u250a       \u2605\u22c6 \u25e6\n\u2605\u22c6       \u250a .  \u02da\n           \u02da\u2605\n\u2606 \u2227,,,\u2227\n\u0b2a(\u201e\u2022 \u0f1d \u2022\u201e)\u0b13\n\u250f\u2501\u222a\u222a\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n", "\n                  \u2606\n\u2606  --------------\n  /__________ \\         \u2606\n |                       |\n \\___________ /                                  \u2606\n   \\.._______../\n    |   /\\__/\\   |\n    | ( \u2022    \u2022    ) |   \u2606                     \u2606\n    | / U  U  \\  |\n    =========\n     \\________/.\n                               \u2606                           \u2606\n\n   \u2606                                         \u2606\n                     \u2606                               \u2606\n", "\n                              \u2571|\u3001\n                         =(\u02da\u02d5 \u3002 7\n                             |\u3001 ~\u3035\n                            \u3058\u3057   \u02cd,)\u3065\n", "\n)     /\\__/\\\n( =/   \u2022 \u2022   \\=\n-------U-U-----------------\n|                                |\n|    we live in a society        |\n|                                |\n------------------------------\n", "\n.      \u2227,,,,\u2227,,,,,,,\u2227\n     (  _  _ )\u2a4a^ )~\u2661\n     /      \u2282      \\\n", "\n    /\\,,,/\\\n>(  \u2022 . \u2022   )<\n  / >\u2740<  \\\n"];
(function() {
  function randRange(a, b) { return a + Math.random() * (b - a); }

  function spawnCat() {
    const el = document.createElement('pre');
    el.className = 'ss-cat';
    el.textContent = SS_CATS[Math.floor(Math.random() * SS_CATS.length)];
    el.style.fontSize = randRange(0.55, 1.6) + 'rem';
    el.style.color = Math.random() < 0.5 ? 'var(--accent)' : 'var(--accent2)';
    el.style.opacity = '0';
    // position off-screen first so we can measure its real rendered size —
    // ascii pieces vary a lot in width, and positioning by left/top edge
    // alone (rather than accounting for that width) visually skews content
    // toward the right, leaving the true left edge sparse.
    el.style.left = '0px';
    el.style.top = '0px';
    document.body.appendChild(el);
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const maxLeft = Math.max(0, window.innerWidth - w);
    const maxTop = Math.max(0, window.innerHeight - h);
    el.style.left = randRange(0, maxLeft) + 'px';
    el.style.top = randRange(0, maxTop) + 'px';
    requestAnimationFrame(() => { el.style.opacity = String(randRange(0.5, 0.95)); });
    const lifespan = randRange(3000, 7000);
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 900);
    }, lifespan);
  }

  for (let i = 0; i < 18; i++) { setTimeout(spawnCat, i * 70); }
  setInterval(spawnCat, 220);

  function goBack() { window.location.href = 'index.html'; }

  document.body.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    goBack();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') goBack();
  });
})();
</script>
