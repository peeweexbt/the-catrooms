<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>screensaver &middot; the catrooms</title>
<style>
:root {
  --bg: #07040d;
  --fg: #d7f2ff;
  --dim: #7a5c9e;
  --accent: #00f0ff;
  --accent2: #ff2ee6;
  --card: #120a1f;
  --border: #2a1840;
}
* { box-sizing: border-box; }
body {
  position: relative;
  background: var(--bg);
  color: var(--fg);
  font-family: "Courier New", ui-monospace, monospace;
  margin: 0;
  padding: 0;
  line-height: 1.5;
}
.decor-cat {
  position: absolute;
  margin: 0;
  font-size: 0.62rem;
  line-height: 1.15;
  white-space: pre;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  text-shadow: 0 0 6px currentColor;
}
@media (max-width: 1500px) {
  .decor-cat { display: none; }
}
.grid, header {
  position: relative;
  z-index: 1;
}
header {
  padding: 48px 24px 24px;
  text-align: center;
}
.hero-cat {
  display: block;
  margin: 20px auto 0;
  max-width: 260px;
  width: 60%;
  height: auto;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 0 0 8px;
}
header h1 {
  color: var(--accent);
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  margin: 0;
  text-transform: lowercase;
}
.mascot {
  color: var(--accent);
  font-size: 0.75rem;
  line-height: 1.15;
  margin: 0;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
}
.screensaver-trigger {
  display: inline-block;
  margin: 18px auto 0;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: inherit;
  text-decoration: none;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  padding: 6px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.screensaver-trigger:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.ss-cat {
  position: absolute;
  margin: 0;
  white-space: pre;
  line-height: 1.15;
  pointer-events: none;
  user-select: none;
  text-shadow: 0 0 8px currentColor;
  transition: opacity 0.9s ease;
}
.ss-hint {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--dim);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  z-index: 1;
}
header p {
  color: var(--dim);
  max-width: 640px;
  margin: 0 auto;
  font-size: 0.9rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  padding: 32px;
  max-width: 1200px;
  margin: 0 auto;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 18px;
  text-decoration: none;
  color: var(--fg);
  display: block;
  transition: border-color 0.15s ease;
}
.card:hover {
  border-color: var(--accent);
}
.card .tag {
  color: var(--dim);
  font-size: 0.75rem;
  display: block;
  margin-bottom: 8px;
}
.card .title {
  color: var(--accent);
  font-size: 0.95rem;
}
.back {
  display: inline-block;
  margin: 24px;
  color: var(--dim);
  text-decoration: none;
}
.back:hover { color: var(--accent); }
.transcript {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 24px 64px;
}
.turn {
  border-left: 2px solid var(--border);
  padding: 4px 0 4px 16px;
  margin-bottom: 20px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.turn.lm1 { border-color: var(--accent2); }
.turn.lm2 { border-color: var(--accent); }
.turn .who {
  display: block;
  font-size: 0.75rem;
  color: var(--dim);
  margin-bottom: 6px;
}
.turn.ascii {
  border-left: none;
  border-top: 1px dashed var(--border);
  border-bottom: 1px dashed var(--border);
  text-align: center;
  color: var(--accent);
  padding: 12px 0;
  margin: 12px 0 28px;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
  font-size: 0.85rem;
}
.turn.ascii .who {
  color: var(--dim);
  text-align: center;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.note {
  color: var(--dim);
  font-size: 0.8rem;
  max-width: 760px;
  margin: 16px auto;
  padding: 0 24px;
}

body { overflow: hidden; cursor: pointer; }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; back to the catrooms</a>
<div class="ss-hint">click anywhere, or press esc, to go back</div>
<script>
const SS_CATS = ["\n /\\_/\\\n( o.o )\n > ^ <\n", "\n  /\\___/\\\n (  o.o  )\n  > ^ ^ <\n", "\n     /\\___/\\\n    ( o   o )   >> scanning...\n     )  Y  (    >> ears: antenna mod v2\n    (   |   )\n     \\_____/\n", "\n      .-=====-.\n     ( [0]  .. )\n      '-==Y==-'\n       |  |  |\n   ...picking through the neon rain...\n", "\n        /\\_/\\\n       ( -.- )\n        > ^ <\n   ~~~~~~|||~~~~~~[DATA JACK: LINKED]\n", "\n     /\\/\\_/\\/\\\n    (  O   O  )\n     \\  ^Y^  /\n      )=====(      -- ears up, rotor incoming --\n", "\n   ___                                  ___\n  /___\\   [] [] [] [] [] [] [] []    /___\\\n  ( ..)\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/\\/(.. )\n   '''                                '''\n", "\n   /\\_/\\        [ ENERGY: LOW ]\n  ( >.< )       [ ]  [ ]  [ ]  [ ]\n   > ~ <        one bar left, keep moving\n", "\n  \u2591\u2592\u2593 /\\_/\\ \u2593\u2592\u2591\n  \u2591\u2592\u2593( o\u2588o )\u2593\u2592\u2591   -- signal interference --\n  \u2591\u2592\u2593 > \u2593 < \u2593\u2592\u2591\n", "\n        ,--.\n       ( o.o)__\n        '--'   \\___\n                 \\  \\__/\\_/\\\n                  \\_(  o.o  )\n                     > ^ < (watching the towers blink)\n"];
(function() {
  function randRange(a, b) { return a + Math.random() * (b - a); }

  function spawnCat() {
    const el = document.createElement('pre');
    el.className = 'ss-cat';
    el.textContent = SS_CATS[Math.floor(Math.random() * SS_CATS.length)];
    el.style.top = randRange(2, 92) + '%';
    el.style.left = randRange(2, 88) + '%';
    el.style.fontSize = randRange(0.55, 1.6) + 'rem';
    el.style.color = Math.random() < 0.5 ? 'var(--accent)' : 'var(--accent2)';
    el.style.opacity = '0';
    document.body.appendChild(el);
    requestAnimationFrame(() => { el.style.opacity = String(randRange(0.5, 0.95)); });
    const lifespan = randRange(3000, 7000);
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 900);
    }, lifespan);
  }

  for (let i = 0; i < 18; i++) { setTimeout(spawnCat, i * 70); }
  setInterval(spawnCat, 220);

  function goBack() { window.location.href = 'index.html'; }

  document.body.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    goBack();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') goBack();
  });
})();
</script>
</body>
</html>
